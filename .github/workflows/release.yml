name: Release Desktop App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip the test suite and only build (unsigned unless \"sign\" is set; nothing is published)"
        type: boolean
        default: false
      sign:
        description: "Sign (and notarize on macOS) the Windows and macOS builds even though this isn't a tagged release (tests the signing setup; still publishes nothing)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # Run the full test suite first. The release build only proceeds if
  # tests pass. Uses `workflow_call` from .github/workflows/tests.yml so
  # the same jobs run identically on push, PR, and release.
  tests:
    if: ${{ !inputs.skip_tests }}
    uses: ./.github/workflows/tests.yml

  # Lookout Native (clients/native, GPUI): builds the Lookout-native_*
  # artifacts that native-updates (below) signs into update.json, plus a .dmg
  # for first installs on macOS, plus the Linux repository packages.
  # The bundling itself lives in
  # clients/native/packaging/ so it runs the same way on a dev machine.
  # Untagged (manual) runs build unsigned artifacts for testing unless `sign`
  # is set; only tags stamp the tag's version and publish. A manual run with
  # `skip_tests` skips the tests; download the lookout-native-* artifacts from
  # the run page.
  native-build:
    needs: tests
    # `skip_tests` skips the tests; a skipped need would skip this job too
    # unless the condition says otherwise.
    if: >-
      ${{ !cancelled()
      && (needs.tests.result == 'success' || (inputs.skip_tests && needs.tests.result == 'skipped')) }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: darwin-aarch64
          # Cross-built on Apple Silicon.
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: darwin-x86_64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
          # Built on an Arm runner rather than cross-built, so the unit tests
          # run on the real target too.
          - platform: windows-11-arm
            target: aarch64-pc-windows-msvc
            label: windows-aarch64
          # Built on glibc 2.39, but the binary only needs 2.34 (RHEL 9):
          # packaging/linux/packages.sh checks. The .deb still needs 24.04's
          # libraries; the rpm runs on RHEL 9 too.
          - platform: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
          - platform: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            label: linux-aarch64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Build: GPUI (X11/Wayland/xkbcommon/fontconfig), wry (WebKitGTK 4.1),
      # the recorder (GStreamer, PipeWire, xcap's xcb/gbm), and the deb/rpm/Arch
      # packaging tools. No AppImage: it can't register the lookout:// handler
      # (sign-in), so Linux ships only as packages (packaging/linux/appimage.sh
      # is kept but unused).
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-randr0-dev \
            libxcb-shm0-dev \
            libxcb-xfixes0-dev \
            libxrandr-dev \
            libfontconfig-dev \
            libfreetype-dev \
            libvulkan-dev \
            libegl-dev \
            libgbm-dev \
            libdbus-1-dev \
            libpipewire-0.3-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            gstreamer1.0-pipewire \
            glib-networking \
            libglib2.0-bin \
            libgdk-pixbuf2.0-bin \
            desktop-file-utils \
            dpkg-dev \
            rpm \
            zstd \
            patchelf \
            binutils \
            file

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          workspaces: "./clients/native -> target"
          shared-key: native-${{ matrix.target }}

      # The app reports CARGO_PKG_VERSION to the updater and update.json
      # carries the tag's, so the two must agree.
      - name: Stamp the tag's version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: clients/native/packaging/version.sh --set "${GITHUB_REF_NAME#v}"

      - name: Build, sign and notarize (macOS)
        if: runner.os == 'macOS'
        run: clients/native/packaging/macos/bundle.sh --target ${{ matrix.target }} --out clients/native/dist
        env:
          # Empty on untagged runs without `sign`: bundle.sh then signs ad hoc and skips notarizing.
          APPLE_CERTIFICATE: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.sign) && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.sign) && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.sign) && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Require the repository key for Linux releases
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Linux'
        run: grep -q 'BEGIN PGP PUBLIC KEY BLOCK' clients/native/packaging/linux/repo/lookout-archive-keyring.asc

      - name: Verify native migration and installer unit tests
        # Tagged releases only: this compiles the whole dependency tree a second
        # time (dev profile), so manual tester builds skip it.
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        working-directory: clients/native
        run: cargo test -p lookout-native --locked --target ${{ matrix.target }}

      - name: Build Linux packages
        if: runner.os == 'Linux'
        run: clients/native/packaging/linux/packages.sh --out clients/native/dist

      # Only on tags: manual runs publish nothing, so they skip the ~1-2 min
      # of clean-container installs.
      - name: Verify native Linux packages
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Linux'
        run: |
          set -euo pipefail
          dir=clients/native/dist
          deb=$(find "$dir" -name '*.deb' -printf '%f\n')
          docker run --rm -v "$PWD/$dir:/pkg:ro" -v "$PWD/scripts/verify-deb.sh:/verify.sh:ro" \
            -e "DEB=$deb" -e PKG=lookout ubuntu:24.04 bash /verify.sh
          rpm=$(find "$dir" -name '*.rpm' -printf '%f\n')
          # One rpm, two families that name their packages differently, and
          # EL9: glibc 2.34 and no WebKitGTK 4.1.
          for image in fedora:43 opensuse/tumbleweed almalinux:9; do
            docker run --rm -v "$PWD/$dir:/pkg:ro" -v "$PWD/scripts/verify-rpm.sh:/verify.sh:ro" \
              -e "RPMFILE=$rpm" "$image" bash /verify.sh
          done
          if [ "$RUNNER_ARCH" = X64 ]; then
            pkg=$(find "$dir" -name '*.pkg.tar.zst' -printf '%f\n')
            docker run --rm -v "$PWD/$dir:/pkg:ro" -v "$PWD/scripts/verify-arch.sh:/verify.sh:ro" \
              -e "PKGFILE=$pkg" archlinux:latest bash /verify.sh
          fi

      # ring builds its aarch64-pc-windows-msvc code with clang, not cl.exe.
      - name: Make sure clang is available (Windows Arm64)
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        shell: bash
        run: |
          if ! command -v clang >/dev/null; then
            choco install llvm -y --no-progress
            echo "C:\\Program Files\\LLVM\\bin" >> "$GITHUB_PATH"
          fi
          clang --version || "/c/Program Files/LLVM/bin/clang" --version

      - name: Build (Windows)
        if: runner.os == 'Windows'
        working-directory: clients/native
        run: cargo build --release -p lookout-native --target ${{ matrix.target }}

      # Azure Artifact Signing. sign.cmd signs lookout.exe, which is also the installer (src/installer/).
      - name: Configure Windows code signing
        if: (startsWith(github.ref, 'refs/tags/v') || inputs.sign) && runner.os == 'Windows'
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          cargo install artifact-signing-cli --version 0.11.0 --locked
          signtool=$(find "/c/Program Files (x86)/Windows Kits/10/bin" \
            -name signtool.exe -path '*/x64/*' 2>/dev/null | sort -V | tail -1)
          if [ -z "$signtool" ]; then
            echo "::error::No x64 signtool.exe found under the Windows 10 SDK." >&2
            exit 1
          fi
          signtool=$(cygpath -w "$signtool")
          # SIGN_CMD runs unquoted through cmd, so its path must have no spaces.
          sign_cmd="$RUNNER_TEMP\\lookout-sign.cmd"
          printf '@echo off\r\nartifact-signing-cli -e https://eus.codesigning.azure.net -a lookout -c lookout --sign-tool-path "%s" %%1\r\n' "$signtool" > "$sign_cmd"
          cat "$sign_cmd"
          case "$sign_cmd" in *" "*) echo "::error::$sign_cmd has a space in it" >&2; exit 1 ;; esac
          probe="$RUNNER_TEMP\\probe.exe"
          cp ~/.cargo/bin/artifact-signing-cli.exe "$probe"
          cmd //c "$sign_cmd" "$probe"
          "$signtool" verify //pa "$probe"
          echo "SIGN_CMD=$sign_cmd" >> "$GITHUB_ENV"
          echo "SIGNTOOL=$signtool" >> "$GITHUB_ENV"

      - name: Build the installer (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          version=$(clients/native/packaging/version.sh)
          mkdir -p clients/native/dist
          # lookout.exe is its own installer (src/installer/): sign it and
          # ship it under the -setup.exe name that native-updates and the
          # in-app updater (which runs it with /S /UPDATE /R) key off.
          exe=clients/native/target/${{ matrix.target }}/release/lookout.exe
          if [ -n "${SIGN_CMD:-}" ]; then
            cmd //c "$SIGN_CMD" "$(cygpath -aw "$exe")"
          fi
          cp "$exe" "clients/native/dist/Lookout-native_${version}_${{ matrix.label }}-setup.exe"

      - name: Verify the installer is signed (Windows)
        if: (startsWith(github.ref, 'refs/tags/v') || inputs.sign) && runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          "$SIGNTOOL" verify //pa //v clients/native/target/${{ matrix.target }}/release/lookout.exe
          for exe in clients/native/dist/Lookout-native_*-setup.exe; do
            "$SIGNTOOL" verify //pa //v "$exe"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          # native-updates downloads lookout-native-* and keys off the file names.
          name: lookout-native-${{ matrix.label }}
          if-no-files-found: error
          path: clients/native/dist/*

      # Native crash reports (minidumps, see src/crash.rs) arrive as raw
      # addresses; Sentry symbolicates them with these, matched by debug id.
      # Skipped when the token isn't available (forks, Dependabot).
      #
      # SENTRY_AUTH_TOKEN must be an org token for the `hack-club` Sentry org,
      # where `lookout-native` lives: an org token
      # always overrides SENTRY_ORG. Never fails the release: a missing symbol
      # upload only means unsymbolicated crash reports.
      - name: Upload debug symbols to Sentry
        continue-on-error: true
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: hack-club
          SENTRY_PROJECT: lookout-native
        run: |
          set -euo pipefail
          if [ -z "${SENTRY_AUTH_TOKEN:-}" ]; then
            echo "::warning::SENTRY_AUTH_TOKEN is not set; native crash reports from this build won't be symbolicated."
            exit 0
          fi
          case "$RUNNER_OS" in
            macOS) files=(clients/native/target/${{ matrix.target }}/release/lookout.dSYM) ;;
            Windows) files=(clients/native/target/${{ matrix.target }}/release/lookout.exe clients/native/target/${{ matrix.target }}/release/lookout.pdb) ;;
            *) files=(clients/native/target/release/lookout) ;;
          esac
          npx --yes @sentry/cli@2 debug-files upload --include-sources --wait "${files[@]}"

      - name: Upload Windows debug symbols (.pdb)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: pdb-native-${{ matrix.label }}
          if-no-files-found: warn
          path: clients/native/target/${{ matrix.target }}/release/*.pdb

  # The draft release, with the Linux packages (the apt/dnf/pacman repositories
  # take them from here). native-updates adds the macOS and Windows builds.
  release:
    needs: native-build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download the Linux packages
        uses: actions/download-artifact@v8
        with:
          pattern: lookout-native-linux-*
          merge-multiple: true
          path: linux

      - name: Create the draft release
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          ls -la linux
          gh release create "$TAG" --draft --title "Lookout ${TAG}" \
            --notes "Download Lookout for your computer below."
          gh release upload "$TAG" linux/*.deb linux/*.rpm linux/*.pkg.tar.zst --clobber

  # Lookout Native's updates: signed update.json + zstd patches, and
  # latest.json for anyone still on the old Tauri app. Contract with
  # native-build:
  #   actions/upload-artifact name `lookout-native-<anything>`, files named
  #   Lookout-native_<version>_darwin-aarch64.app.tar.gz   (tar of Lookout.app/)
  #   Lookout-native_<version>_darwin-x86_64.app.tar.gz
  #   Lookout-native_<version>_windows-x86_64-setup.exe    (lookout.exe, its own installer)
  #   Lookout-native_<version>_windows-aarch64-setup.exe
  # Linux has no self-updating build (no AppImage): its packages update through
  # the apt/rpm/Arch repositories, so update.json carries no linux entry.
  # Stable: update.json + artifacts + patches go on the tag's release (live
  # once it's published, via releases/latest/download/update.json).
  # Beta: everything also goes on the rolling `channel-beta` prerelease, live
  # immediately (draft-release URLs aren't public). Every tag feeds Beta;
  # only tags without a pre-release suffix (v1.2.3, not v1.2.3-beta.1) feed
  # Stable. Rollout/blocked/min-supported come from repository variables.
  native-updates:
    # Publish only when every native platform and the draft release succeeded.
    needs: [release, native-build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download native artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: lookout-native-*
          merge-multiple: true
          path: native

      - name: Any native artifacts?
        id: native
        run: |
          shopt -s nullglob
          files=(native/Lookout-native_*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No Lookout Native artifacts in this release — nothing to do."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            printf 'Native artifact: %s\n' "${files[@]}"
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust stable
        if: steps.native.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Build lookout-update-tool
        if: steps.native.outputs.present == 'true'
        working-directory: clients/native
        run: cargo build --release -p lookout-update-tool --locked

      - name: Fetch the previous releases' native artifacts (patch bases)
        if: steps.native.outputs.present == 'true'
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          mkdir -p prev
          found=0
          for t in $(gh release list --limit 30 --json tagName --jq '.[].tagName' | grep '^v' | grep -vx "$TAG"); do
            gh release download "$t" --pattern 'Lookout-native_*' --dir "prev/$t" 2>/dev/null || true
            if ls "prev/$t"/Lookout-native_* >/dev/null 2>&1; then
              found=$((found + 1))
            else
              rm -rf "prev/$t"
            fi
            [ "$found" -ge 3 ] && break
          done
          echo "Patch bases from $found earlier release(s)"; ls -R prev

      - name: Generate, sign and publish update.json
        if: steps.native.outputs.present == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ROLLOUT: ${{ vars.NATIVE_UPDATE_ROLLOUT || '1' }}
          BLOCKED: ${{ vars.NATIVE_UPDATE_BLOCKED || '' }}
          MIN_SUPPORTED: ${{ vars.NATIVE_UPDATE_MIN_SUPPORTED || '' }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          TOOL=clients/native/target/release/lookout-update-tool
          REPO_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download"
          # Release notes: the annotated tag's message, else a pointer to the release.
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG" >/dev/null 2>&1 || true
          git tag -l --format='%(contents)' "$TAG" | sed '/-----BEGIN PGP/,$d' > notes.txt
          [ -s notes.txt ] || echo "See what's new at https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG" > notes.txt
          PREV_ARGS=()
          for d in prev/*/; do [ -d "$d" ] && PREV_ARGS+=(--previous "$d"); done

          publish() { # channel base-url out-dir upload-tag
            "$TOOL" manifest --version "$VERSION" --channel "$1" --artifacts native \
              --base-url "$2" --out "$3" --notes-file notes.txt \
              --rollout "$ROLLOUT" --blocked "$BLOCKED" --min-supported "$MIN_SUPPORTED" \
              "${PREV_ARGS[@]}" --sign
            "$TOOL" verify "$3/update.json"
            cat "$3/update.json"
            gh release upload "$4" native/Lookout-native_* "$3"/* --clobber
          }

          case "$VERSION" in
            *-*) echo "Pre-release tag: Beta channel only." ;;
            *) publish stable "$REPO_URL/$TAG" out-stable "$TAG" ;;
          esac

          gh release view channel-beta >/dev/null 2>&1 || gh release create channel-beta --prerelease \
            --title "Lookout Native beta channel" \
            --notes "Rolling release the Lookout Native beta channel updates from (update.json). Not for direct download."
          # Releases are immutable once published, so the rolling channel-beta
          # release refuses new assets. Don't let that stop the stable release.
          publish beta "$REPO_URL/channel-beta" out-beta channel-beta \
            || echo "::warning::The beta channel (channel-beta) couldn't be updated: published releases are immutable here."

      # Moves people still on the old Tauri app (v0.3.x) onto Lookout Native.
      # Their updater reads releases/latest/download/latest.json, so it lists
      # the native macOS and Windows (x64, Arm64) builds and the Tauri app
      # installs them as an ordinary update:
      # - macOS: it swaps in the Lookout.app inside the .app.tar.gz and relaunches
      #   Contents/MacOS/lookout, which native has too (same bundle id).
      # - Windows: it runs the setup.exe with `/S /UPDATE /R /ARGS` (or /P on
      #   older builds), flags the native installer takes as a silent update. It
      #   installs to the same %LOCALAPPDATA%\Lookout and Uninstall\Lookout key.
      # First launch imports the Tauri app's sign-ins (store.rs import::from_tauri).
      # Signatures: the same minisign key, base64-wrapped the way Tauri expects.
      # Stable tags only: Tauri builds have no beta channel.
      - name: Write latest.json for the old Tauri app
        if: steps.native.outputs.present == 'true' && !contains(github.ref_name, '-')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          TOOL=clients/native/target/release/lookout-update-tool
          BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG"
          mkdir -p takeover
          jq -n --arg v "v$VERSION" --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version: $v, notes: "Lookout is now a native app.", pub_date: $d, platforms: {}}' > takeover/latest.json

          entry() { # tauri-key native-file
            local f="native/$2"
            if [ ! -f "$f" ]; then
              echo "::error::$2 is missing, so $1 can't be moved to Lookout Native."
              exit 1
            fi
            # gh release upload stores files under their base names.
            "$TOOL" sign "$f"
            "$TOOL" verify "$f"
            jq --arg k "$1" --arg url "$BASE_URL/$2" --arg sig "$(base64 -w0 "$f.minisig")" \
              '.platforms[$k] = {url: $url, signature: $sig}' \
              takeover/latest.json > takeover/next.json
            mv takeover/next.json takeover/latest.json
          }

          entry darwin-aarch64 "Lookout-native_${VERSION}_darwin-aarch64.app.tar.gz"
          entry darwin-x86_64 "Lookout-native_${VERSION}_darwin-x86_64.app.tar.gz"
          entry windows-x86_64 "Lookout-native_${VERSION}_windows-x86_64-setup.exe"
          entry windows-aarch64 "Lookout-native_${VERSION}_windows-aarch64-setup.exe"

          echo "latest.json:"; cat takeover/latest.json
          gh release upload "$TAG" takeover/latest.json --clobber

      # Short names for the downloads people click, so they get Lookout.dmg rather
      # than Lookout-native_0.4.1_darwin-aarch64.dmg, and stable links work:
      # https://github.com/hackclub/lookout/releases/latest/download/Lookout.dmg
      # The long names stay: update.json, latest.json and patches key off them.
      - name: Upload the downloads under short names
        if: steps.native.outputs.present == 'true' && !contains(github.ref_name, '-')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          mkdir -p short
          link() { # long-name short-name
            if [ -f "native/$1" ]; then
              cp "native/$1" "short/$2"
            else
              echo "::warning::native/$1 is missing, so there's no $2."
            fi
          }
          link "Lookout-native_${VERSION}_darwin-aarch64.dmg" Lookout.dmg
          link "Lookout-native_${VERSION}_darwin-x86_64.dmg" Lookout-Intel.dmg
          link "Lookout-native_${VERSION}_windows-x86_64-setup.exe" Lookout-Setup.exe
          link "Lookout-native_${VERSION}_windows-aarch64-setup.exe" Lookout-Setup-ARM.exe
          ls -la short
          gh release upload "$TAG" short/* --clobber
          # Lookout.dmg and Lookout-Intel.dmg are the same files; updates use the .app.tar.gz.
          for dmg in "Lookout-native_${VERSION}_darwin-aarch64.dmg" "Lookout-native_${VERSION}_darwin-x86_64.dmg"; do
            gh release delete-asset "$TAG" "$dmg" --yes || true
          done

  # The github-pages environment only deploys from main, so a tag can't run the
  # repositories' publish itself: start packages.yml on main for this tag. It
  # takes the tag's packages even while the release is still a draft.
  packages:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Publish the apt, dnf and pacman repositories (packages.yml on main)
        run: gh workflow run packages.yml -R "$GITHUB_REPOSITORY" --ref main -f tag="$GITHUB_REF_NAME"
