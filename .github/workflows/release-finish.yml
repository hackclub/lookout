name: Finish a release

# The last steps of release.yml's native-updates job, against a release that
# was already built (a draft): point the Tauri updater's latest.json at the
# Lookout Native builds, and add the short-named downloads. Releases are
# immutable once published, so run this on the draft, before publishing.
# Same logic as release.yml; signs with the release key (secrets).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (its draft), e.g. v0.4.1"
        type: string
        required: true

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download the native builds from the release
        run: |
          set -euo pipefail
          mkdir -p native takeover short
          gh release download "$TAG" --dir native --pattern 'Lookout-native_*'
          gh release download "$TAG" --dir takeover --pattern latest.json
          ls -la native takeover

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Build lookout-update-tool
        working-directory: clients/native
        run: cargo build --release -p lookout-update-tool --locked

      - name: Point the Tauri updater (latest.json) at Lookout Native
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          TOOL=clients/native/target/release/lookout-update-tool
          BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG"
          cp takeover/latest.json takeover/latest.tauri.json

          entry() { # tauri-key native-file
            local f="native/$2"
            if [ ! -f "$f" ]; then
              echo "::error::$2 is missing, so $1 can't be moved to Lookout Native."
              exit 1
            fi
            "$TOOL" sign "$f"
            "$TOOL" verify "$f"
            jq --arg k "$1" --arg url "$BASE_URL/$2" --arg sig "$(base64 -w0 "$f.minisig")" \
              '.platforms[$k] = {url: $url, signature: $sig}' \
              takeover/latest.json > takeover/next.json
            mv takeover/next.json takeover/latest.json
          }

          entry darwin-aarch64 "Lookout-native_${VERSION}_darwin-aarch64.app.tar.gz"
          entry darwin-x86_64 "Lookout-native_${VERSION}_darwin-x86_64.app.tar.gz"
          entry windows-x86_64 "Lookout-native_${VERSION}_windows-x86_64-setup.exe"
          entry windows-aarch64 "Lookout-native_${VERSION}_windows-aarch64-setup.exe"
          jq 'del(.platforms["darwin-universal"])' takeover/latest.json > takeover/next.json
          mv takeover/next.json takeover/latest.json

          # Every platform the Tauri app asks for must now be a native build.
          jq -e --arg v "$VERSION" '
            .platforms | to_entries | length == 4 and all(.value.url | contains("Lookout-native_" + $v + "_"))
          ' takeover/latest.json
          echo "latest.json now:"; cat takeover/latest.json
          gh release upload "$TAG" takeover/latest.json takeover/latest.tauri.json --clobber

      - name: Upload the downloads under short names
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          link() { # long-name short-name
            cp "native/$1" "short/$2"
          }
          link "Lookout-native_${VERSION}_darwin-aarch64.dmg" Lookout.dmg
          link "Lookout-native_${VERSION}_darwin-x86_64.dmg" Lookout-Intel.dmg
          link "Lookout-native_${VERSION}_windows-x86_64-setup.exe" Lookout-Setup.exe
          link "Lookout-native_${VERSION}_windows-aarch64-setup.exe" Lookout-Setup-ARM.exe
          ls -la short
          gh release upload "$TAG" short/* --clobber
