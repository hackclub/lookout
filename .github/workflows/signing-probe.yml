name: Probe Windows signing

# Debugging aid for the Windows code signing path, and nothing else. It
# builds no app, cuts no release and publishes nowhere -- it only answers
# "can this runner sign a file at all, and if not, why".
#
# It exists because tauri-bundler captures the sign command's output and
# reports only `failed to run artifact-signing-cli`, so the real error is
# invisible from inside a release build. Reproducing that inside release.yml
# costs a tag and a full matrix; here it costs a button.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    env:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
    steps:
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: What this runner actually has
        shell: bash
        run: |
          # Every one of these is a prerequisite artifact-signing-cli assumes,
          # and each has a hardcoded default path inside the tool that may not
          # match this image.
          echo "--- secrets present (values never printed)"
          for v in AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET; do
            if [ -n "${!v:-}" ]; then echo "  $v: set"; else echo "  $v: EMPTY"; fi
          done
          echo "--- signtool candidates"
          find "/c/Program Files (x86)/Windows Kits/10/bin" -name signtool.exe -path '*/x64/*' 2>/dev/null | sort -V | tail -3 || echo "  none"
          echo "--- azure cli candidates (the tool defaults to the non-x86 path)"
          ls "/c/Program Files/Microsoft SDKs/Azure/CLI2/wbin/az.cmd" 2>/dev/null || echo "  not at C:\\Program Files\\..."
          ls "/c/Program Files (x86)/Microsoft SDKs/Azure/CLI2/wbin/az.cmd" 2>/dev/null || echo "  not at C:\\Program Files (x86)\\..."
          command -v az && az version 2>&1 | head -5 || echo "  az not on PATH"
          echo "--- dotnet"
          command -v dotnet && dotnet --list-sdks 2>&1 | head -5 || echo "  dotnet not on PATH"

      - name: Install the signer
        shell: bash
        run: cargo install artifact-signing-cli --version 0.11.0 --locked

      - name: Sign a throwaway binary, showing everything
        shell: bash
        run: |
          set -uo pipefail
          signtool=$(find "/c/Program Files (x86)/Windows Kits/10/bin" \
            -name signtool.exe -path '*/x64/*' 2>/dev/null | sort -V | tail -1)
          signtool=$(cygpath -m "$signtool")
          echo "signtool: $signtool"

          artifact-signing-cli --help || true

          probe="$(mktemp -d)/probe.exe"
          cp ~/.cargo/bin/artifact-signing-cli.exe "$probe"
          probe=$(cygpath -m "$probe")

          echo "=== attempting the exact command release.yml runs ==="
          set -x
          artifact-signing-cli \
            -e https://eus.codesigning.azure.net \
            -a lookout -c lookout \
            --sign-tool-path "$signtool" "$probe"
          rc=$?
          set +x
          echo "=== exit code: $rc ==="
          [ $rc -eq 0 ] && "$signtool" verify //pa "$probe"
          exit $rc
