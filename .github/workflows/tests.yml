name: Tests

on:
  push:
    branches: [main]
  pull_request:
  # Allow other workflows (e.g. release) to require these jobs before
  # they themselves run by depending on this workflow via `needs`.
  workflow_call:

# Least-privilege by default. Individual jobs can override if they ever
# need to write artifacts/releases, but the test suite is read-only.
permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────
  # Server: TypeScript + Vitest, integration tests against real Postgres.
  # Covers the credit-mode dispatcher, envelope validation, streak math,
  # idempotency, pause/resume, and legacy-wire-shape compat tests.
  # ──────────────────────────────────────────────────────────────────
  server:
    name: Server tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lookout
          POSTGRES_PASSWORD: lookout
          POSTGRES_DB: lookout_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U lookout"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://lookout:lookout@localhost:5434/lookout_test
      # Tests don't actually hit R2 (the AWS SDK is mocked in setup.ts),
      # but config/r2.ts throws on import if these are unset.
      R2_ACCOUNT_ID: test-account
      R2_ACCESS_KEY_ID: test-key
      R2_SECRET_ACCESS_KEY: test-secret
      R2_BUCKET_NAME: test-bucket
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin-secret
      # Subprocess test that spawns `cargo test --test legacy_client` against
      # a real Fastify server. Skipping in CI keeps the matrix fast — the
      # cross-language compat is already covered by Rust unit tests below,
      # which run the same legacy structs against the same JSON shape.
      SKIP_RUST_SUBPROCESS: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w packages/shared

      - name: Run migrations
        working-directory: packages/server
        run: npx drizzle-kit migrate

      - name: Type-check server
        working-directory: packages/server
        run: npx tsc --noEmit

      - name: Vitest (unit + integration)
        working-directory: packages/server
        run: npx vitest run

  # ──────────────────────────────────────────────────────────────────
  # Worker: ffmpeg segment pipeline. Proves the clip-compile contract —
  # every capture unit (JPEG still, VP8 webm clip, H.264 mp4 clip, any
  # resolution) normalizes to exactly one second of 30fps video with
  # pinned parameters, and the segments stream-copy concatenate into a
  # decodable MP4. Runs real ffmpeg on synthetic inputs; no DB/R2.
  # ──────────────────────────────────────────────────────────────────
  worker:
    name: Worker tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w packages/shared

      - name: Type-check worker
        working-directory: packages/worker
        run: npx tsc --noEmit

      - name: Vitest (segment pipeline)
        run: npm test -w packages/worker

      # Shared package: pure units — cut math, clock-offset estimation.
      - name: Vitest (shared)
        run: npm test -w packages/shared

  # ──────────────────────────────────────────────────────────────────
  # Desktop client: Rust unit + serde compat tests.
  # The 4-way matrix (legacy/new struct × legacy/new JSON) here is the
  # load-bearing proof that the currently-shipped binary can still
  # deserialize what the new server emits.
  # ──────────────────────────────────────────────────────────────────
  desktop-rust:
    name: Desktop Rust tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libx11-dev \
            libxcb-randr0-dev \
            libxcb-shm0-dev \
            libpipewire-0.3-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgbm-dev

      # RUNTIME GStreamer plugins, not just the dev headers above. The Linux
      # clip encoder builds `appsrc ! videoconvert ! x264enc ! h264parse !
      # mp4mux ! filesink`, and those elements live in four different packages:
      # videoconvert in -base, mp4mux in -good, h264parse in -bad, x264enc in
      # -ugly. Without them ClipRecorder::new fails with "no H.264 encoder
      # element available" and every clip test that touches a real encoder dies
      # — which is exactly how this job has been failing.
      #
      # This is also the only place the Linux encoder path is executed at all
      # (macOS runs it locally, Windows is check-only), so installing them is
      # what makes that path tested rather than merely compiled.
      - name: Install GStreamer runtime plugins
        run: |
          sudo apt-get install -y \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      # Cache key is platform-based (not workflow-based) so the registry
      # + git deps populated by tests.yml are reused by release.yml's
      # Linux-native build, and vice versa. The key matches the entry in
      # release.yml's matrix for ubuntu-24.04 + native target.
      # Underlying key includes hashFiles('Cargo.lock') + rustc version,
      # so any lockfile change naturally invalidates the cache.
      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "./clients/desktop/src-tauri -> target"
          shared-key: rust-ubuntu-24.04-native

      # Release, not debug. The clip encoders are unsafe FFI against
      # VideoToolbox / Media Foundation / GStreamer, and that is exactly the
      # code whose behaviour differs under optimisation — the kind of bug this
      # project has already been bitten by once (a datatype-misalignment crash
      # that only showed up in a release build). Testing debug binaries proves
      # the wrong artifact.
      - name: cargo test --lib --release
        working-directory: clients/desktop/src-tauri
        run: cargo test --lib --release

  # ──────────────────────────────────────────────────────────────────
  # Windows type-check: the Media Foundation clip encoder is Windows-only
  # cfg code that no other job compiles. A check (not full test run)
  # catches API drift in the `windows` crate bindings.
  # ──────────────────────────────────────────────────────────────────
  desktop-rust-windows:
    name: Desktop Rust check (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "./clients/desktop/src-tauri -> target"
          shared-key: rust-windows-check

      # Release profile, matching what actually ships (see the Linux job).
      # This is the only job that compiles the Windows-only Media Foundation
      # encoder at all, so it should compile it the way users get it.
      - name: cargo check --release
        working-directory: clients/desktop/src-tauri
        run: cargo check --release

  # ──────────────────────────────────────────────────────────────────
  # Type-check the rest of the workspace (React/web clients). Catches
  # regressions in the shared types or the credit-mode client wiring.
  # ──────────────────────────────────────────────────────────────────
  clients-typecheck:
    name: Client type-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared + react packages
        run: |
          npm run build -w packages/shared
          npm run build -w clients/react

      - name: Type-check desktop frontend
        working-directory: clients/desktop
        run: npx tsc --noEmit

      # Vitest hook tests for the user-facing recording timer. Pinned to
      # the SDK + web — desktop uses the SDK build so coverage transits.
      # The recorder Lookout hosts itself at /session. Type-checked here
      # because it ships inside the server image — a break in it is a break
      # in the URL the API hands to every integrating program.
      - name: Type-check hosted recorder
        working-directory: clients/hosted
        run: npx tsc --noEmit

      - name: Vitest (React SDK)
        run: npm test -w clients/react

      - name: Vitest (web client)
        run: npm test -w clients/web

      - name: Vitest (hosted recorder)
        run: npm test -w clients/hosted
