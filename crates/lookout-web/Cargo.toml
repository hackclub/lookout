[package]
name = "lookout-web"
version = "0.3.14"
edition = "2021"
description = "Lookout's recorder for the browser: lookout-recorder over a JavaScript host, compiled to WebAssembly"
publish = false

[lib]
name = "lookout_web"
crate-type = ["cdylib", "rlib"]

[dependencies]
lookout-session = { path = "../lookout-session" }
lookout-protocol = { path = "../lookout-protocol" }
lookout-recorder = { path = "../lookout-recorder" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
bytes = "1"
gloo-timers = { version = "0.4", features = ["futures"] }
console_error_panic_hook = "0.1"
