[package]
name = "lookout-update"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Update v2 for Lookout Native: signed update.json, rollout, zstd patch-from deltas, resumable downloads, on-disk updater state"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
minisign-verify = "0.3"
# No legacy-format decoders or dictionary builder: smaller, and plain C to cross-compile.
zstd = { version = "0.14", default-features = false }
flate2 = "1"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }
tokio = { version = "1", features = ["rt"], optional = true }

[features]
default = ["net"]
# The resumable downloader (the app); the release tool doesn't need it.
net = ["dep:reqwest", "dep:tokio"]

[dev-dependencies]
minisign = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tiny_http = "0.12"
tempfile = "3"
