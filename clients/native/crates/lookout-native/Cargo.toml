[package]
name = "lookout-native"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Lookout — native desktop client (GPUI)"
publish = false

[[bin]]
name = "lookout"
path = "src/main.rs"

[dependencies]
gpui-kit = { version = "=0.8.1", default-features = false }
lookout-core = { path = "../../../desktop/src-tauri/crates/lookout-core", default-features = false, features = ["ashpd-async-io"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
smallvec = "1"
dirs = "6"
url = "2"
open = "5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
parking_lot = "0.12"
futures = "0.3"
flume = "0.11"
log = "0.4"
env_logger = "0.11"
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
unicode-segmentation = "1"
# ProgramPanel: the program's page in a native webview (WebKitGTK / WKWebView / WebView2).
wry = { version = "0.57", optional = true }
lookout-update = { path = "../lookout-update" }
flate2 = "1"
# Crash/error reporting: panics, `log::error!`s and — via the minidump crash
# reporter process — native crashes (segfaults, aborts, FFI faults) that never
# reach Rust's panic handler. rustls, not native-tls, like our own reqwest.
sentry = { version = "0.49.5", default-features = false, features = ["backtrace", "contexts", "debug-images", "panic", "release-health", "log", "minidump", "reqwest", "rustls-no-provider"] }
# Sentry's reqwest 0.13 brings no crypto provider; we install ring (what our own
# reqwest 0.12 already uses) rather than build aws-lc-sys.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tar = "0.4"

[features]
default = ["webview"]
# Embed ProgramPanel pages. Without it (or without WebKitGTK at build time) the
# panel always offers "Open in browser".
webview = ["dep:wry", "dep:gtk", "dep:webkit2gtk"]

[build-dependencies]
swift-rs = { version = "1.0.7", features = ["build"] }
# The exe's icon and version info on Windows (build.rs).
embed-resource = "3"

[target.'cfg(unix)'.dependencies]
# statvfs for the installer's "Space available" (installer/ops.rs).
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["tokio"] }
zbus = "5"
# Compositor check on X11 (see platform::desktop_appearance::client_frames).
x11rb = "0.13"
gstreamer = { version = "0.25", features = ["v1_18"] }
gstreamer-app = "0.25"
gstreamer-video = "0.25"
gstreamer-pbutils = "0.25"
gtk = { version = "0.18", optional = true }
webkit2gtk = { version = "=2.0.2", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_Direct3D", "Win32_Graphics_Gdi", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Com_Urlmon", "Win32_System_SystemInformation", "Wdk_System_SystemServices", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_Memory"] }
tray-icon = "0.21"
# The installer's per-user registry keys (installer/ops.rs).
winreg = "0.56"
# `#[implement]` for the Media Foundation engine callback.
windows-core = "0.62"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSArray", "NSDictionary", "NSError", "NSValue"] }
objc2-app-kit = "0.3"
objc2-av-foundation = { version = "0.3", features = ["AVPlayer", "AVPlayerItem", "AVPlayerItemOutput", "AVTime", "block2", "AVAsset", "AVAssetReader", "AVAssetReaderOutput", "AVAssetTrack", "AVMediaFormat", "AVUtilities", "objc2-core-media", "objc2-core-video", "AVCaptureDevice", "AVCaptureInput", "AVCaptureSession", "AVCaptureOutputBase", "AVCaptureVideoDataOutput", "dispatch2"] }
objc2-core-media = { version = "0.3", features = ["CMTime", "CMTimeRange", "CMSampleBuffer", "CMBase", "objc2-core-video"] }
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-quartz-core = "0.3"
block2 = "0.6"
objc2-core-video = { version = "0.3", features = ["CVPixelBuffer", "CVImageBuffer", "CVBuffer", "CVReturn", "CVPixelFormatDescription", "CVBase"] }
raw-window-handle = "0.6"
dispatch2 = "0.3"
