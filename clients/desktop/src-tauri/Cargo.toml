[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

# Emit debug info (.pdb on MSVC) for release builds so crash offsets can be
# symbolized. Does not change codegen/optimization.
#
# PLATFORM CAVEAT — the reason release.yml overrides this for Linux. Debug info
# lands in a separate file only on MSVC (.pdb) and macOS (.dSYM, outside the
# .app). On Linux it is embedded directly in the ELF, which made the 0.3.7
# bundles 136MB against a 6MB Windows installer, and cost 76 minutes of
# single-threaded xz in the rpm bundler — 85% of the Linux job. So the workflow
# sets CARGO_PROFILE_RELEASE_DEBUG=false on Linux; if you build a Linux release
# by hand and care about size, do the same.
[profile.release]
debug = true

[package]
name = "lookout-desktop"
version = "0.3.9"
edition = "2021"

[lib]
name = "lookout_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Compiles swift/lookout-tray (SwiftUI menu-bar item with numericText digit
# animation) and links it into the macOS binary; no-op on other targets.
swift-rs = { version = "1.0.7", features = ["build"] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "devtools", "tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# SIMD resizing (SSE4/AVX2/NEON) for the capture downscale — ~4x faster than
# the `image` crate's scalar filters at screen sizes (29ms → 7ms, 5K→1080p).
fast_image_resize = "5"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
# Refcounted byte buffers for the upload pipeline — retrying an R2 PUT clones
# the request body, and `Bytes` makes that clone a refcount bump instead of a
# full JPEG copy. Already in the dependency tree via tokio/reqwest.
bytes = "1"
tauri-plugin-deep-link = "2.4.7"
tauri-plugin-http = "2.5.7"
tauri-plugin-macos-permissions = "2.3.0"
tauri-plugin-single-instance = "2.4.0"
url = "2"
os_info = "3"
window-vibrancy = "0.7.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-opener = "2.5.3"
tauri-plugin-liquid-glass = "0.1.6"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
sentry = "0.38"

[dev-dependencies]
# `test-util` enables tokio's paused-clock (`start_paused`) so retry-backoff
# tests run instantly instead of actually sleeping 2s+4s between attempts.
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-foundation = { version = "0.3.2", features = ["NSProcessInfo", "NSString", "NSArray", "NSData", "NSDictionary", "NSEnumerator", "NSBundle", "NSURL"] }
objc2-app-kit = { version = "0.3.2", features = ["NSWorkspace", "NSRunningApplication", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphicsContext", "objc2-core-graphics"] }
# Clip encoding: hardware H.264 via AVAssetWriter (VideoToolbox under the
# hood) writing MP4 directly. All already in the tree transitively via xcap.
objc2-av-foundation = { version = "0.3.2", features = ["AVAssetWriter", "AVAssetWriterInput", "AVMediaFormat", "AVVideoSettings", "objc2-core-media", "objc2-core-video"] }
objc2-core-media = { version = "0.3.2", features = ["CMTime"] }
objc2-core-video = { version = "0.3.2", features = ["CVPixelBuffer", "CVBuffer", "CVReturn", "CVImageBuffer"] }
block2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.38"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    # Clip encoding: hardware H.264 via the Media Foundation sink writer.
    "Win32_Media_MediaFoundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    # GetCurrentProcess, for the GDI-object leak check in test_support.
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target."cfg(target_os = \"linux\")".dependencies]
ashpd = { version = "0.9", default-features = false, features = ["tokio"] }
# Window input shaping (window_shape.rs). Pinned to the same minor Tauri
# links against — a different gtk would give us a second, incompatible
# ApplicationWindow type and gtk_window() would stop unifying.
gtk = "0.18"
gstreamer = "0.24.5"
gstreamer-app = "0.24.5"
gstreamer-video = "0.24.5"
