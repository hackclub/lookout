[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

# Emit debug info (.pdb on MSVC) for release builds so crash offsets can be
# symbolized. Does not change codegen/optimization.
#
# PLATFORM CAVEAT — the reason release.yml overrides this for Linux. Debug info
# lands in a separate file only on MSVC (.pdb) and macOS (.dSYM, outside the
# .app). On Linux it is embedded directly in the ELF, which made the 0.3.7
# bundles 136MB against a 6MB Windows installer, and cost 76 minutes of
# single-threaded xz in the rpm bundler — 85% of the Linux job. So the workflow
# sets CARGO_PROFILE_RELEASE_DEBUG=false on Linux; if you build a Linux release
# by hand and care about size, do the same.
[profile.release]
debug = true

[workspace]
members = ["crates/lookout-core"]

[package]
name = "lookout-desktop"
version = "0.4.0"
edition = "2021"

[lib]
name = "lookout_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Compiles swift/lookout-tray (SwiftUI menu-bar item with numericText digit
# animation) and links it into the macOS binary; no-op on other targets.
swift-rs = { version = "1.0.7", features = ["build"] }

[dependencies]
# The capture/clip/upload/API engine. UI-toolkit independent — see
# crates/lookout-core/src/lib.rs for the shell contract.
lookout-core = { path = "crates/lookout-core" }
tauri = { version = "2", features = ["macos-private-api", "devtools", "tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
tokio = { version = "1", features = ["full"] }
tauri-plugin-deep-link = "2.4.7"
tauri-plugin-http = "2.5.7"
tauri-plugin-macos-permissions = "2.3.0"
tauri-plugin-single-instance = "2.4.0"
url = "2"
window-vibrancy = "0.7.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-opener = "2.5.4"
tauri-plugin-liquid-glass = "0.1.6"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
sentry = "0.38"

[dev-dependencies]
# tests/legacy_client.rs drives a real server with the pre-credit-mode wire
# structs; it is the only reqwest user left in this crate.
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }

[target.'cfg(target_os = "macos")'.dependencies]
# enable_vibrancy reads the OS version for its corner radius.
objc2-foundation = { version = "0.3.2", features = ["NSProcessInfo"] }

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.38"

[target."cfg(target_os = \"linux\")".dependencies]
# Session-bus service the GNOME pill extension reads the recording state from
# (gnome_indicator.rs). Already in the tree via tauri-plugin-single-instance,
# xcap and notify-rust, so this is a direct dep on an existing build. The
# `tokio` feature keeps zbus on the runtime the rest of the app spawns onto
# rather than starting an async-io reactor beside it.
zbus = { version = "5", features = ["tokio"] }
# Window input shaping (window_shape.rs). Pinned to the same minor Tauri
# links against — a different gtk would give us a second, incompatible
# ApplicationWindow type and gtk_window() would stop unifying.
gtk = "0.18"
# dlopen/dlsym for the GBM probe (gbm_probe.rs), so asking libgbm whether it
# can allocate a buffer costs us a runtime lookup instead of a link-time
# dependency on libgbm. Already in the tree several times over — this is a
# direct dep on an existing build.
libc = "0.2"
# Background blur behind the window (background_blur.rs), through
# `ext-background-effect-v1`. All three are already in the tree via
# xcap → libwayshot-xcap, so this is a direct dep on an existing build.
#
# The protocol lands in wayland-protocols 0.32.13; an older 0.32.x compiles
# everything else here and then fails on the one module we want, so the
# minimum is spelled out rather than left to whatever the lockfile has.
wayland-client = "0.31"
# `client_system` is what makes `wayland_client::backend` the libwayland-backed
# one, and with it `Backend::from_foreign_display` — the whole reason this
# works at all, since the display we attach to is GDK's, not ours.
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
