<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lookout</title>
    <script>
      // Before the stylesheet below, deliberately. The rules keyed on
      // .os-linux decide whether this window is opaque or transparent, and
      // a class added at the end of <body> arrives after the browser has
      // already painted — which showed as a fifth of a second of solid,
      // square window every launch before the real chrome appeared.
      //
      // Kept to what CSS needs before that first paint. Anything touching
      // <body> cannot run here: it does not exist yet.
      (function () {
        var ua = navigator.userAgent.toLowerCase();
        if (ua.indexOf('linux') !== -1 && ua.indexOf('android') === -1) {
          document.documentElement.classList.add('os-linux');
          // Both Linux windows are undecorated, so they draw their own
          // corners, border and shadow. Unless something else already is:
          // the Rounded Window Corners extensions round and shade every
          // window from its real edge, which is 40px outside ours, so you
          // get two frames nested with a band of desktop between them. The
          // native side decides and plants the answer before this runs
          // (js_init_script in lib.rs); `lookout-csd` is the single switch
          // for every rule that assumes a frame, here and in linuxChrome.ts.
          if (window.__LOOKOUT_SHELL_DRAWS_FRAME__ !== true) {
            document.documentElement.classList.add('lookout-csd');
          }
          // The Adwaita overrides are keyed on data-theme, and App.tsx only
          // sets it once React has mounted.
          document.documentElement.setAttribute(
            'data-theme',
            window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          );
        }
      })();
    </script>
    <style>
      
      @font-face {
        font-family: 'Geist';
        src: url('/fonts/Geist-Regular.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
      }
      @font-face {
        font-family: 'Geist';
        src: url('/fonts/Geist-Medium.woff2') format('woff2');
        font-weight: 500;
        font-style: normal;
      }
      @font-face {
        font-family: 'Geist';
        src: url('/fonts/Geist-SemiBold.woff2') format('woff2');
        font-weight: 600;
        font-style: normal;
      }
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { height: 100%; overflow: hidden; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Geist', 'Segoe UI', Roboto, sans-serif; background: var(--color-bg-body, transparent); color: var(--color-text-primary, #e5e5e5); user-select: none; -webkit-user-select: none; cursor: default; overscroll-behavior: none; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    
      /* Hide scrollbar for Windows/Linux to maintain clean transparent look */
      ::-webkit-scrollbar {
        width: 0px;
        background: transparent;
      }
      body.os-windows { transform: rotate(0.001deg); }

      /* First-paint background.

         `body` above resolves its colour from --color-bg-body, and that
         variable does not exist until the bundle runs and theme.ts injects
         its sheet — so the frame before that fell through to `transparent`
         and showed the webview's own white. A flash of white on a dark
         desktop, every launch.

         Painted on `html` rather than `body` on purpose: `body` must keep
         its var-based rule, and a second declaration for it here would win
         on source order and pin the background forever. These values shadow
         theme.ts's and want updating with it. */
      html { background: #242424; }
      html[data-theme="light"] { background: #fafafa; }
      @media (prefers-color-scheme: light) {
        html:not([data-theme="dark"]) { background: #fafafa; }
      }

      /* Linux draws its own rounded window, and the class lands synchronously
         in the script below — so the first frame can be the right shape too
         rather than a square that rounds off a moment later.

         Keyed on .lookout-csd, not .os-linux: a session whose shell already
         rounds and shades every window gets none of this, and falls through
         to the opaque square `html` painted above. */
      html.os-linux.lookout-csd { background: transparent; }
      html.os-linux.lookout-csd #root {
        position: fixed;
        inset: 40px;
        height: auto;
        background: #242424;
        border-radius: 12px;
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.18),
          0 2px 8px rgba(0, 0, 0, 0.1),
          0 8px 28px rgba(0, 0, 0, 0.14);
      }
      html.os-linux.lookout-csd[data-theme="light"] #root {
        background: #fafafa;
        box-shadow:
          0 0 0 1px rgba(0, 0, 0, 0.18),
          0 2px 8px rgba(0, 0, 0, 0.08),
          0 8px 28px rgba(0, 0, 0, 0.1);
      }

      /* Linux: prefer the desktop's own UI font over the bundled one, so the
         app reads as part of the session rather than a page inside it. The
         exact family the user configured is applied from linuxChrome.ts once
         GSettings answers; this is what shows until then. */
      html.os-linux body {
        font-family: 'Adwaita Sans', Cantarell, system-ui, 'Geist', sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="debug" style="display:none;position:fixed;bottom:0;left:0;right:0;background:#111;color:#0f0;font-family:monospace;font-size:11px;padding:0 8px 8px;max-height:40vh;overflow:auto;z-index:99999;border-top:1px solid #333;"></div>
    <script>
      (function() {
        const ua = navigator.userAgent.toLowerCase();
        if (ua.includes('windows') || ua.includes('linux')) {
          document.body.classList.add('os-windows');
        }
      })();
      window.__dbg = function(msg) {
        var el = document.getElementById('debug');
        if (el) el.innerHTML += new Date().toLocaleTimeString() + ' ' + msg + '<br>';
        console.log('[DBG]', msg);
      };
      window.onerror = function(msg, src, line) { window.__dbg('ERROR: ' + msg + ' (' + src + ':' + line + ')'); };
      window.onunhandledrejection = function(e) { window.__dbg('UNHANDLED: ' + (e.reason?.message || e.reason)); };
      window.addEventListener('keydown', function(e) {
        if (e.key === '`') {
          var el = document.getElementById('debug');
          if (!el) return;
          var show = el.style.display === 'none';
          el.style.display = show ? 'block' : 'none';
          if (show && window.__dbgRender) window.__dbgRender();
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
